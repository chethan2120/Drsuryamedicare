        <text x="55" y="46" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="white" text-anchor="middle">500</text>
      
        <circle cx="55" cy="97" r="20" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
        <text x="55" y="101" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="white" text-anchor="middle">500</text>
      
        <circle cx="110" cy="42" r="20" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
        <text x="110" y="46" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="white" text-anchor="middle">500</text>
      
        <circle cx="110" cy="97" r="20" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
        <text x="110" y="101" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="white" text-anchor="middle">500</text>
      
        <circle cx="165" cy="42" r="20" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
        <text x="165" y="46" font-family="Inter, sans-serif" font-weight="800" font-size="9" fill="white" text-anchor="middle">500</text>
      
