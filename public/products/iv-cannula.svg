<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="canBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#EAF3E9"/>
        </linearGradient>
        <filter id="canShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#046A38" flood-opacity="0.12"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#canBg)"/>
      <g filter="url(#canShadow)" transform="translate(100, 220)">
        <!-- Green Cannula 18G -->
        <g transform="translate(0, 0)">
          <!-- Wings -->
          <ellipse cx="140" cy="80" rx="40" ry="22" fill="#10b981"/>
          <!-- Body -->
          <rect x="100" y="68" width="80" height="24" rx="4" fill="#059669"/>
          <!-- Flashback Chamber -->
          <rect x="180" y="70" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
          <rect x="235" y="73" width="15" height="14" rx="2" fill="#10b981"/>
          <!-- Needle -->
          <line x1="100" y1="80" x2="10" y2="80" stroke="#94a3b8" stroke-width="3"/>
          <text x="140" y="85" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="white" text-anchor="middle">18G</text>
        </g>
        <!-- Pink Cannula 20G -->
        <g transform="translate(140, 60)">
          <ellipse cx="140" cy="80" rx="40" ry="22" fill="#ec4899"/>
          <rect x="100" y="68" width="80" height="24" rx="4" fill="#db2777"/>
          <rect x="180" y="70" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
          <rect x="235" y="73" width="15" height="14" rx="2" fill="#ec4899"/>
          <line x1="100" y1="80" x2="10" y2="80" stroke="#94a3b8" stroke-width="3"/>
          <text x="140" y="85" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="white" text-anchor="middle">20G</text>
        </g>
      </g>
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>