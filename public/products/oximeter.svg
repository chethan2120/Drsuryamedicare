<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="oxiBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#EAF3E9"/>
        </linearGradient>
        <filter id="oxiShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#046A38" flood-opacity="0.15"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#oxiBg)"/>
      <g filter="url(#oxiShadow)" transform="translate(180, 130)">
        <!-- Oximeter Body -->
        <rect x="0" y="0" width="240" height="340" rx="36" fill="white" stroke="#cbd5e1" stroke-width="3"/>
        <!-- Screen Bezel -->
        <rect x="25" y="35" width="190" height="210" rx="20" fill="#020617" stroke="#1e293b" stroke-width="4"/>
        <!-- SpO2 99% & PR 74 -->
        <text x="45" y="70" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#38bdf8">%SpO2</text>
        <text x="45" y="145" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="64" fill="#38bdf8">99</text>
        <text x="140" y="70" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#facc15">PR bpm</text>
        <text x="140" y="145" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="54" fill="#facc15">74</text>
        <!-- Waveform Graph -->
        <path d="M 40 200 L 70 200 L 80 180 L 90 220 L 100 170 L 110 210 L 120 200 L 190 200" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
        <!-- Power Button -->
        <circle cx="120" cy="285" r="24" fill="#046A38"/>
        <circle cx="120" cy="285" r="16" fill="white" opacity="0.9"/>
      </g>
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>