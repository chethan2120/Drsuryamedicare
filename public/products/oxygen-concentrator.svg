<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="oxyBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
        <filter id="oxyShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#046A38" flood-opacity="0.15"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#oxyBg)"/>
      <g filter="url(#oxyShadow)" transform="translate(160, 90)">
        <rect x="0" y="0" width="280" height="420" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
        <rect x="25" y="30" width="230" height="110" rx="12" fill="#0f172a"/>
        <text x="45" y="65" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#38bdf8">OXYGEN PURITY</text>
        <text x="45" y="115" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="44" fill="#38bdf8">95.4%</text>
        <!-- Flowmeter Tube -->
        <rect x="180" y="50" width="20" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="190" cy="75" r="5" fill="#facc15"/>
        <text x="210" y="90" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="white">10 LPM</text>
        <!-- Humidifier Bottle Cavity -->
        <rect x="35" y="170" width="90" height="150" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
        <rect x="50" y="240" width="60" height="70" rx="6" fill="#0284c7" opacity="0.4"/>
        <!-- Ventilation Grille -->
        <line x1="150" y1="200" x2="245" y2="200" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="218" x2="245" y2="218" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="236" x2="245" y2="236" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="254" x2="245" y2="254" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="272" x2="245" y2="272" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="290" x2="245" y2="290" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
        <!-- Caster Wheels at Bottom -->
        <circle cx="45" cy="430" r="14" fill="#334155"/>
        <circle cx="235" cy="430" r="14" fill="#334155"/>
      </g>
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>