<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="ivBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#F2ECE4"/>
        </linearGradient>
        <filter id="ivShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#046A38" flood-opacity="0.12"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#ivBg)"/>
      <g filter="url(#ivShadow)" transform="translate(180, 80)">
        <!-- Plastic Spike at Top -->
        <polygon points="120,40 105,90 135,90" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
        <rect x="110" y="90" width="20" height="20" fill="#38bdf8" rx="2"/>
        <!-- Drip Chamber -->
        <rect x="100" y="110" width="40" height="90" rx="8" fill="white" stroke="#94a3b8" stroke-width="3" opacity="0.9"/>
        <line x1="100" y1="160" x2="140" y2="160" stroke="#38bdf8" stroke-width="2"/>
        <rect x="105" y="165" width="30" height="30" fill="#bae6fd" opacity="0.5" rx="4"/>
        <!-- Blue Air Vent Cap on side -->
        <rect x="140" y="120" width="18" height="18" rx="3" fill="#0284c7"/>
        <circle cx="149" cy="129" r="4" fill="white"/>
        <!-- Flexible PVC Tubing Loops -->
        <path d="M 120 200 C 120 260, 20 280, 20 340 C 20 400, 220 360, 220 420 C 220 480, 120 480, 120 500" fill="none" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
        <path d="M 120 200 C 120 260, 20 280, 20 340 C 20 400, 220 360, 220 420 C 220 480, 120 480, 120 500" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <!-- Roller Clamp in Middle -->
        <rect x="10" y="320" width="36" height="48" rx="6" fill="#046A38" stroke="#073D27" stroke-width="2"/>
        <circle cx="28" cy="344" r="8" fill="#FFFCF6"/>
        <!-- Luer Lock Needle Connector at End -->
        <rect x="112" y="495" width="16" height="24" rx="2" fill="#0284c7"/>
        <line x1="120" y1="519" x2="120" y2="550" stroke="#64748b" stroke-width="2"/>
      </g>
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>