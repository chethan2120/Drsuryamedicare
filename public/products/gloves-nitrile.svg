<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#F2E8D8"/>
        </linearGradient>
        <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#046A38"/>
          <stop offset="100%" stop-color="#073D27"/>
        </linearGradient>
        <linearGradient id="gloveGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="50%" stop-color="#0284c7"/>
          <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#073D27" flood-opacity="0.12"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#bgGrad)"/>
      <g filter="url(#cardShadow)">
        <!-- Glove Box Perspective -->
        <rect x="80" y="200" width="300" height="260" rx="16" fill="white" stroke="#E7E2D8" stroke-width="3"/>
        <path d="M80 200 h300 v90 h-300 z" fill="url(#boxGrad)" rx="16"/>
        <text x="100" y="240" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="20" fill="#FFFCF6">SuryaSafe Nitrile</text>
        <text x="100" y="265" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#9ae6b4">POWDER-FREE EXAMINATION GLOVES</text>
        <!-- Oval dispenser port -->
        <ellipse cx="230" cy="360" rx="80" ry="32" fill="#EAF3E9" stroke="#046A38" stroke-width="2" stroke-dasharray="6,4"/>
        <!-- Glove sticking out of dispenser -->
        <path d="M190 355 C210 320, 240 310, 260 340 C280 325, 290 350, 270 380 C240 395, 205 385, 190 355 Z" fill="url(#gloveGrad)"/>
        <!-- Detail Badges -->
        <rect x="100" y="420" width="80" height="22" rx="4" fill="#046A38"/>
        <text x="140" y="435" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="white" text-anchor="middle">100 GLOVES</text>
        <rect x="190" y="420" width="60" height="22" rx="4" fill="#EAF3E9"/>
        <text x="220" y="435" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#046A38" text-anchor="middle">SIZE M</text>
      </g>
      <!-- Big Nitrile Glove Specimen on Right -->
      <g filter="url(#cardShadow)" transform="translate(320, 140)">
        <path d="M120 40 C110 40, 100 60, 100 100 L95 180 C85 160, 70 160, 60 180 C50 200, 70 230, 85 240 L85 300 C85 320, 100 340, 130 350 L190 350 C210 340, 220 320, 220 290 L220 210 C230 190, 220 170, 210 170 C200 170, 190 190, 190 200 L190 110 C190 80, 175 75, 165 95 L165 90 C165 65, 150 60, 140 75 L140 60 C140 40, 130 40, 120 40 Z" fill="url(#gloveGrad)"/>
        <!-- Textured grip dots on fingertips -->
        <circle cx="120" cy="55" r="2.5" fill="#bae6fd"/>
        <circle cx="140" cy="68" r="2.5" fill="#bae6fd"/>
        <circle cx="165" cy="85" r="2.5" fill="#bae6fd"/>
        <circle cx="190" cy="120" r="2.5" fill="#bae6fd"/>
      </g>
      <!-- Clean Medical Stamp -->
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>