    <rect x="0" y="0" width="400" height="360" rx="28" fill="white" stroke="#E7E2D8" stroke-width="3"/>
    
    <path d="M0 28 Q0 0 28 0 L372 0 Q400 0 400 28 L400 75 L0 75 Z" fill="url(#card_wipes)"/>
    <text x="24" y="38" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="16" fill="#FFFCF6">SuryaClean Bed Bath Wipes</text>
    <text x="24" y="58" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#EAF3E9">HYGIENE CONSUMABLES • CLINICAL GRADE</text>
    
    <g transform="translate(80, 110)">
      
      <!-- Bath wipes pack with flip cap -->
