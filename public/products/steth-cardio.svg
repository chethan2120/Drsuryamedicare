<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="stethBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#F2EAE0"/>
        </linearGradient>
        <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f8fafc"/>
          <stop offset="50%" stop-color="#94a3b8"/>
          <stop offset="100%" stop-color="#475569"/>
        </linearGradient>
        <filter id="stethShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#073D27" flood-opacity="0.15"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#stethBg)"/>
      <g filter="url(#stethShadow)" transform="translate(100, 80)">
        <!-- Earpieces & Binaural Tubing -->
        <path d="M 80 40 C 90 140, 170 180, 200 200" fill="none" stroke="url(#steelGrad)" stroke-width="10" stroke-linecap="round"/>
        <path d="M 320 40 C 310 140, 230 180, 200 200" fill="none" stroke="url(#steelGrad)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="80" cy="40" r="12" fill="#046A38"/>
        <circle cx="320" cy="40" r="12" fill="#046A38"/>
        <!-- Main Flexible Y-Tubing -->
        <path d="M 200 200 C 200 280, 50 320, 50 420 C 50 500, 300 500, 300 420" fill="none" stroke="#046A38" stroke-width="18" stroke-linecap="round"/>
        <path d="M 200 200 C 200 280, 50 320, 50 420 C 50 500, 300 500, 300 420" fill="none" stroke="#073D27" stroke-width="4" stroke-linecap="round"/>
        <!-- Stainless Steel Chestpiece Dual-Head -->
        <g transform="translate(300, 420)">
          <circle cx="0" cy="0" r="54" fill="url(#steelGrad)" stroke="#334155" stroke-width="4"/>
          <circle cx="0" cy="0" r="42" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
          <circle cx="0" cy="0" r="18" fill="url(#steelGrad)"/>
          <text x="0" y="4" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="8" fill="#046A38" text-anchor="middle">SURYA</text>
        </g>
      </g>
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>