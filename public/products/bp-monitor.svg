<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  
      <defs>
        <linearGradient id="bpBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFCF6"/>
          <stop offset="100%" stop-color="#EAF3E9"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e2e8f0"/>
        </linearGradient>
        <filter id="bpShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#046A38" flood-opacity="0.15"/>
        </filter>
      </defs>
      <rect width="600" height="600" fill="url(#bpBg)"/>
      <g filter="url(#bpShadow)" transform="translate(140, 120)">
        <!-- Digital Unit Case -->
        <rect x="0" y="0" width="320" height="360" rx="32" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="3"/>
        <!-- LCD Display Bezel -->
        <rect x="35" y="40" width="250" height="200" rx="16" fill="#0f172a" stroke="#334155" stroke-width="4"/>
        <!-- LCD Content (120 / 80 / Pulse 72) -->
        <text x="60" y="75" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#94a3b8">SYS mmHg</text>
        <text x="60" y="140" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="64" fill="#38bdf8">120</text>
        <text x="60" y="170" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#94a3b8">DIA mmHg</text>
        <text x="60" y="225" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="54" fill="#38bdf8">80</text>
        <text x="210" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">PULSE /min</text>
        <text x="210" y="210" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="40" fill="#4ade80">72</text>
        <!-- Big Green Start Button -->
        <rect x="60" y="270" width="200" height="54" rx="27" fill="#046A38" stroke="#073D27" stroke-width="2"/>
        <text x="160" y="303" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="16" fill="#FFFCF6" text-anchor="middle">START / STOP</text>
      </g>
      <rect x="40" y="40" width="160" height="32" rx="16" fill="#046A38" opacity="0.1"/>
      <text x="120" y="61" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#046A38" text-anchor="middle">DR SURYA MEDICARE</text>
    
</svg>